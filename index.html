<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#D4537E">
<title>이유식 큐브 현황</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#f8f8f8;color:#1a1a1a;-webkit-tap-highlight-color:transparent}
:root{--ac:#D4537E;--ac-light:#FBEAF0;--ac-border:#ED93B1;--bg:#ffffff;--bg2:#f5f5f7;--border:#e5e5e7;--text:#1a1a1a;--text2:#6e6e73}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--border:#3a3a3c;--text:#f2f2f7;--text2:#8e8e93}}
#app{max-width:430px;margin:0 auto;background:var(--bg);min-height:100dvh;position:relative;padding-bottom:72px}

/* ── 헤더 ── */
.header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);position:sticky;top:0;z-index:40}
.header-left{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.header-title{font-size:15px;font-weight:700;color:var(--text)}
.baby-row-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.baby-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--bg2);border-radius:20px;cursor:pointer;border:1px solid var(--border);font-size:12px;color:var(--text);transition:all .15s}
.baby-chip.active-chip{background:var(--ac-light);border-color:var(--ac-border)}
.baby-chip-days{color:var(--ac);font-weight:700;font-size:11px}
.header-btn{background:none;border:none;cursor:pointer;font-size:20px;color:var(--text2);padding:4px;flex-shrink:0}
/* 저장 상태 */
.sync-dot{width:7px;height:7px;border-radius:50%;background:#ccc;flex-shrink:0;transition:background .3s}
.sync-dot.saving{background:#EF9F27;animation:pulse .8s infinite}
.sync-dot.saved{background:#1D9E75}
.sync-dot.error{background:#D85A30}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── 하단 탭바 ── */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;display:flex;align-items:stretch;border-top:1px solid var(--border);background:var(--bg);height:56px;z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;color:var(--text2);cursor:pointer;border-top:2px solid transparent;transition:color .15s;padding:0 4px;gap:2px}
.tab.active{color:var(--ac);border-top-color:var(--ac);font-weight:600}
.tab i{font-size:18px}
.tab-add-slot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:6px;cursor:pointer;position:relative;border-top:2px solid transparent}
.tab-add-slot.active .tab-add-label{color:var(--ac)}
.tab-add-fab{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 2px 12px rgba(0,0,0,.2);position:absolute;top:-18px;transition:transform .1s}
.tab-add-fab:active{transform:scale(.92)}
.tab-add-label{font-size:10px;color:var(--text2);margin-top:32px}

/* ── 페이지 ── */
.page{display:none;padding:12px}
.page.active{display:block}
.section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 7px}

/* ── 통계 ── */
.stat-row{display:flex;gap:8px;margin:10px 0}
.stat-card{flex:1;background:var(--bg2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.stat-label{font-size:11px;color:var(--text2)}
.stat-val{font-size:20px;font-weight:700;color:var(--text)}

/* ── 알림 ── */
.alert-box{border-radius:10px;padding:9px 13px;margin-bottom:7px}
.alert-box.warn{background:#FAEEDA;border:1px solid #EF9F27}
.alert-box.danger{background:#FAECE7;border:1px solid #D85A30}
.alert-title{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.alert-box.warn .alert-title{color:#854F0B}
.alert-box.danger .alert-title{color:#4A1B0C}
.alert-box ul{margin:5px 0 0;padding-left:16px}
.alert-box li{font-size:11px;margin-bottom:2px;cursor:pointer;text-decoration:underline dotted}
.alert-box.warn li{color:#854F0B}
.alert-box.danger li{color:#4A1B0C}

/* ── 캘린더 ── */
.cal-wrap{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-nav{background:none;border:none;cursor:pointer;font-size:17px;color:var(--text2);padding:4px 7px}
.cal-title-wrap{display:flex;align-items:center;gap:6px}
.cal-title{font-size:14px;font-weight:600}
.cal-today-btn{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--ac-light);color:var(--ac);border:1px solid var(--ac-border);cursor:pointer}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cal-day-label{text-align:center;font-size:10px;color:var(--text2);padding:2px 0}
.cal-cell{min-height:32px;border-radius:4px;padding:1px 0;cursor:default;display:flex;flex-direction:column;align-items:center}
.cal-cell.has-ev{cursor:pointer}
.cal-cell.has-ev:hover{background:var(--bg2)}
.cal-date{font-size:11px;width:21px;height:21px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.cal-cell.today .cal-date{background:var(--ac);color:#fff;font-weight:700}
.cal-cell.other-month .cal-date{color:var(--border)}
.cal-cell.selected:not(.today) .cal-date{background:var(--bg2);font-weight:600}
.cal-dots{display:flex;gap:2px;justify-content:center;margin-top:1px}
.cal-dot{width:4px;height:4px;border-radius:50%}
.cal-ev-list{margin-top:8px;border-top:1px solid var(--border);padding-top:7px}
.cal-ev-item{display:flex;align-items:center;gap:7px;padding:4px 0;cursor:pointer}
.cal-ev-item:hover .cal-ev-name{text-decoration:underline}
.cal-ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cal-ev-name{font-size:12px;font-weight:500;flex:1;color:var(--text)}
.cal-ev-sub{font-size:11px;color:var(--text2)}

/* ── 큐브 ── */
.sort-bar{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:9px;scrollbar-width:none}
.sort-bar::-webkit-scrollbar{display:none}
.sort-chip{padding:4px 11px;border-radius:20px;font-size:11px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .15s}
.sort-chip.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.search-bar{display:flex;align-items:center;gap:7px;background:var(--bg2);border-radius:8px;padding:7px 11px;margin-bottom:9px}
.search-bar i{color:var(--text2);font-size:15px}
.search-bar input{flex:1;border:none;background:none;font-size:13px;color:var(--text);outline:none}
.cat-section{margin-bottom:7px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.cat-header{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:var(--bg2);cursor:pointer;user-select:none}
.cat-header-left{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--text)}
.cat-badge{font-size:10px;color:var(--text2)}
.cat-chevron{font-size:13px;color:var(--text2);transition:transform .2s}
.cat-chevron.open{transform:rotate(180deg)}
.cat-body{display:none;padding:7px}
.cat-body.open{display:block}
.cube-card{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:5px}
.cube-card:last-child{margin-bottom:0}
.cube-card.dup-flag{border-left:3px solid #EF9F27}
.dup-badge{background:#FAEEDA;color:#854F0B;font-size:9px;padding:1px 6px;border-radius:6px;font-weight:700}
.cube-top{display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.cube-name-wrap{display:flex;align-items:center;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
.cube-name{font-size:14px;font-weight:600;color:var(--text)}
.allergy-badge{font-size:9px;padding:1px 6px;border-radius:6px;font-weight:700}
.allergy-yes{background:#FAECE7;color:#993C1D}
.allergy-no{background:#EAF3DE;color:#3B6D11}
.cube-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.qty-control{display:flex;align-items:center;gap:5px}
.qty-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--text);transition:background .1s}
.qty-btn:active{background:var(--border)}
.qty-val{font-size:17px;font-weight:700;min-width:32px;text-align:center;color:var(--text)}
.qty-unit{font-size:10px;color:var(--text2)}
.cube-meta{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.meta-pill{font-size:10px;padding:2px 7px;border-radius:9px;display:flex;align-items:center;gap:2px}
.pill-ok{background:#EAF3DE;color:#3B6D11}
.pill-soon{background:#FAEEDA;color:#854F0B}
.pill-urgent{background:#FAECE7;color:#4A1B0C}
.pill-expired{background:#FAECE7;color:#4A1B0C;font-weight:700}
.pill-info{background:#E6F1FB;color:#0C447C}
.pill-particle{background:#EEEDFE;color:#26215C}
.cube-note{font-size:11px;color:var(--text2);margin-top:5px;padding:4px 7px;background:var(--bg2);border-radius:5px;line-height:1.5}
.cube-actions{display:flex;gap:5px;margin-top:7px}
.cube-edit-btn{padding:4px 10px;font-size:11px;background:none;color:var(--text2);border:1px solid var(--border);border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.cube-discard-btn{padding:4px 10px;font-size:11px;background:#FAECE7;color:#D85A30;border:1px solid #D85A30;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.btn-use{flex:1;padding:10px;font-size:14px;font-weight:600;background:var(--ac-light);color:var(--ac);border:1px solid var(--ac-border);border-radius:8px;cursor:pointer;transition:all .15s}
.btn-use:active{background:var(--ac);color:#fff}

/* ── 기록 ── */
.hist-filter-bar{display:flex;gap:5px;margin-bottom:10px}
.hist-filter{flex:1;padding:7px;border-radius:7px;font-size:12px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;text-align:center;transition:all .15s}
.hist-filter.f-all{background:var(--bg2);color:var(--text);font-weight:600}
.hist-filter.f-used{background:#FAECE7;color:#993C1D;border-color:#D85A30;font-weight:600}
.hist-filter.f-added{background:#EAF3DE;color:#3B6D11;border-color:#1D9E75;font-weight:600}
.hist-filter.f-discarded{background:#EEEDFE;color:#26215C;border-color:#B3AEED;font-weight:600}
.history-item{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer}
.history-item:last-child{border-bottom:none}
.history-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.history-icon.used{background:#FAECE7;color:#D85A30}
.history-icon.added{background:#EAF3DE;color:#3B6D11}
.history-icon.discarded{background:#EEEDFE;color:#7F77DD}
.history-info{flex:1}
.history-name{font-size:13px;font-weight:600;color:var(--text)}
.history-time{font-size:11px;color:var(--text2);margin-top:1px}
.history-memo{font-size:11px;color:var(--text2);margin-top:2px;padding:3px 7px;background:var(--bg2);border-radius:5px;display:inline-block}
.memo-hint{font-size:10px;color:var(--text2);margin-top:2px;display:flex;align-items:center;gap:2px}
.history-amount{font-size:13px;font-weight:700;flex-shrink:0}
.history-amount.used{color:#D85A30}
.history-amount.added{color:#3B6D11}
.history-amount.discarded{color:#7F77DD}

/* ── 추가 탭 ── */
.add-mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.add-mode-btn{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px 10px;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;width:100%;transition:border-color .15s}
.add-mode-btn:hover{border-color:var(--ac)}
.add-mode-btn i{font-size:26px}
.add-mode-btn div{font-size:13px;font-weight:600;color:var(--text)}
.add-mode-btn small{font-size:11px;color:var(--text2)}

/* ── 모달 ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:20px 20px 0 0;width:100%;max-width:430px;padding:18px;max-height:88vh;overflow-y:auto;overflow-x:hidden;padding-bottom:32px;box-sizing:border-box}
.modal-handle{width:34px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px;color:var(--text)}
.form-group{margin-bottom:12px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:3px;display:block;font-weight:500}
.form-input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--bg);transition:border-color .15s;min-width:0;box-sizing:border-box}
input[type="date"].form-input{width:100%;max-width:100%;box-sizing:border-box}
.form-input:focus{outline:none;border-color:var(--ac)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.form-select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--bg)}
.expire-options{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.expire-opt{padding:5px 11px;border-radius:20px;font-size:12px;border:1px solid var(--border);cursor:pointer;background:var(--bg);color:var(--text);transition:all .15s}
.expire-opt.selected{background:var(--ac);color:#fff;border-color:var(--ac)}
.allergy-toggle{display:flex;gap:6px;margin-top:5px}
.allergy-opt{flex:1;padding:8px;border-radius:7px;font-size:12px;border:1px solid var(--border);cursor:pointer;text-align:center;transition:all .15s;color:var(--text);background:var(--bg)}
.allergy-opt.sel-yes{background:#FAECE7;color:#993C1D;border-color:#D85A30}
.allergy-opt.sel-no{background:#EAF3DE;color:#3B6D11;border-color:#1D9E75}
.allergy-opt.sel-uk{background:var(--bg2);color:var(--text2);font-weight:600}
.particle-toggle{display:flex;gap:6px;margin-top:5px}
.particle-opt{flex:1;padding:8px 4px;border-radius:7px;font-size:11px;border:1px solid var(--border);cursor:pointer;text-align:center;line-height:1.4;transition:all .15s;color:var(--text)}
.particle-opt.sel-p{background:var(--ac-light);color:var(--ac);border-color:var(--ac-border);font-weight:600}
.btn-primary{width:100%;padding:13px;background:var(--ac);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:7px;transition:opacity .15s}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{width:100%;padding:11px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:10px;font-size:14px;cursor:pointer;margin-top:7px}
.btn-danger{width:100%;padding:11px;background:var(--bg);color:#D85A30;border:1px solid #D85A30;border-radius:10px;font-size:14px;cursor:pointer;margin-top:5px}
.emoji-preview{font-size:32px;text-align:center;margin:-3px 0 9px}
.multi-add-row{display:grid;grid-template-columns:1fr 56px;gap:5px;margin-bottom:7px}
.add-row-btn{display:flex;align-items:center;gap:5px;padding:7px 11px;border:1px dashed var(--border);border-radius:7px;width:100%;cursor:pointer;background:none;color:var(--text2);font-size:13px;margin-bottom:10px}
.color-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:5px}
.color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:border-color .15s}
.color-dot.sel{border-color:var(--text)}
.inline-cat-form{background:var(--bg2);border-radius:8px;padding:10px;margin-top:6px;display:none}
.inline-cat-form.open{display:block}
.ic-emoji-row{display:flex;align-items:center;gap:10px;margin-top:5px}
.ic-emoji-preview{font-size:26px;width:32px;text-align:center;flex-shrink:0}
.empty-state{text-align:center;padding:40px 18px;color:var(--text2)}
.empty-state i{font-size:38px;display:block;margin-bottom:9px;opacity:.4}
.empty-state p{font-size:13px}
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:8px}
.theme-swatch{width:100%;aspect-ratio:1;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
.theme-swatch.active{border-color:var(--text)}
.baby-row{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;cursor:pointer;transition:all .15s}
.baby-row.active-baby{border-color:var(--ac);background:var(--ac-light)}
.baby-avatar{width:38px;height:38px;border-radius:50%;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
/* 로딩 */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:12px}
.loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--ac);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
#login-screen{background:var(--bg)}
#login-screen .form-input{font-size:16px}
</style>
</head>
<body>

<div id="loading-screen" class="loading-screen">
  <div class="loading-spinner"></div>
  <div style="font-size:13px;color:#888">데이터 불러오는 중...</div>
</div>
<div class="toast" id="toast"></div>

<!-- 로그인 화면 -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:999;flex-direction:column;align-items:center;justify-content:center;padding:24px">
  <div style="width:100%;max-width:360px">
    <div style="text-align:center;margin-bottom:32px">
      <div style="font-size:48px;margin-bottom:8px">🍼</div>
      <div style="font-size:22px;font-weight:700;color:var(--text)">이유식 큐브 현황</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px">우리 아기 이유식을 스마트하게</div>
    </div>
    <div id="login-form">
      <div class="form-group"><label class="form-label">이메일</label><input type="email" class="form-input" id="auth-email" placeholder="example@email.com" autocomplete="email"></div>
      <div class="form-group"><label class="form-label">비밀번호</label><input type="password" class="form-input" id="auth-password" placeholder="6자 이상" autocomplete="current-password"></div>
      <div id="auth-error" style="font-size:13px;color:#D85A30;margin-bottom:8px;display:none"></div>
      <button class="btn-primary" id="login-btn" onclick="doLogin()">로그인</button>
      <button class="btn-secondary" onclick="showRegister()" style="margin-top:8px">처음이에요 — 회원가입</button>
      <button style="background:none;border:none;color:var(--text2);font-size:13px;cursor:pointer;margin-top:8px;width:100%;text-align:center" onclick="showForgot()">비밀번호를 잊으셨나요?</button>
    </div>
    <div id="register-form" style="display:none">
      <div class="form-group"><label class="form-label">이메일</label><input type="email" class="form-input" id="reg-email" placeholder="example@email.com" autocomplete="email"></div>

// ── API 헬퍼 ──
async function api(method,path,body){
  setSyncState('saving');
  try{
    const opts={method,headers:{'Content-Type':'application/json','Authorization':`Bearer ${getToken()}`}};
    if(body)opts.body=JSON.stringify(body);
    const res=await fetch(`${API_BASE}${path}`,opts);
    if(res.status===401){clearToken();showLoginScreen();throw new Error('로그인이 필요해요');}
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error||res.statusText);}
    const data=await res.json();
    setSyncState('saved');
    return data;
  }catch(e){
    setSyncState('error');
    if(!e.message.includes('Load failed')&&!e.message.includes('Failed to fetch')){
      showToast('⚠️ '+e.message);
    }
    throw e;
  }
}
function setSyncState(s){const d=document.getElementById('sync-dot');if(d){d.className='sync-dot '+s;if(s==='saved')setTimeout(()=>{if(d.classList.contains('saved'))d.className='sync-dot';},2000);}}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// ── 데이터 로드 ──
async function loadAll(){
  // 토큰 없으면 로그인 화면
  if(!getToken()){showLoginScreen();return;}
  try{
    const data=await api('GET','/api/init');
    cache.babies=data.babies||[];
    cache.categories=data.categories||[];
    cache.settings=data.settings||{theme_idx:0,active_baby_id:null};
    cache.cubes=data.cubes||[];
    cache.history=data.history||[];
    cache.favorites=data.favorites||[];  // [{food_name, reaction}]
    if(!cache.settings.active_baby_id&&cache.babies.length)
      cache.settings.active_baby_id=cache.babies[0].id;
    applyTheme(cache.settings.theme_idx||0);
    document.getElementById('loading-screen').style.display='none';
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').style.display='block';
    render();
  }catch(e){
    if(e.message.includes('로그인')){showLoginScreen();return;}
    document.getElementById('loading-screen').innerHTML='<div style="text-align:center;padding:20px;color:#888"><div style="font-size:32px;margin-bottom:10px">⚠️</div><div style="font-size:14px;margin-bottom:8px">서버 연결 실패</div><div style="font-size:12px;color:#aaa">'+e.message+'</div><button onclick="loadAll()" style="margin-top:14px;padding:8px 20px;background:#D4537E;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px">다시 시도</button></div>';
  }
}

function lookupFood(n){const t=n.trim();for(const[k,e,c]of FOOD_MAP){if(t===k)return{emoji:e,cat:c};}for(const[k,e,c]of FOOD_MAP){if(t.includes(k))return{emoji:e,cat:c};}return{emoji:'🍱',cat:null};}
function getCatEmoji(n){const t=n.trim();for(const[k,e]of CAT_EMOJI_MAP){if(t===k||t.includes(k))return e;}return'📦';}
function activeBaby(){return cache.babies.find(b=>b.id===cache.settings.active_baby_id)||cache.babies[0]||null;}
function babyCubes(){const b=activeBaby();if(!b)return cache.cubes;return cache.cubes.filter(c=>c.baby_id===b.id);}
function getDaysLeft(d){if(!d)return null;return Math.ceil((new Date(d)-new Date())/864e5);}
function formatDate(d){if(!d)return'-';const dt=new Date(d);return`${dt.getMonth()+1}/${dt.getDate()}`;}
function formatDateTime(ts){const dt=tsToDate(ts);return`${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}`;}

function getDplus(b){if(!b)return null;return Math.floor((new Date()-new Date(b))/864e5)+1;}
function findDuplicates(cubes){const m={};cubes.filter(c=>c.qty>0).forEach(c=>{const k=(c.name||'').trim().toLowerCase();(m[k]=m[k]||[]).push(c.id);});const s=new Set();Object.values(m).forEach(ids=>{if(ids.length>1)ids.forEach(id=>s.add(id));});return s;}
function applyTheme(i){const t=THEMES[i]||THEMES[0];document.documentElement.style.setProperty('--ac',t.ac);document.documentElement.style.setProperty('--ac-light',t.light);document.documentElement.style.setProperty('--ac-border',t.border);}
function tsToDate(ts){
  // Unix 타임스탬프가 초인지 밀리초인지 판별
  const ms = ts > 1e10 ? ts : ts * 1000;
  return new Date(ms);
}
function uid8(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

function renderBabyChip(){
  const area=document.getElementById('baby-chip-area');
  if(!cache.babies.length){area.innerHTML=`<div class="baby-chip" onclick="openBabyModal()"><span>👶</span><span style="color:var(--text2)">아기 추가</span></div>`;return;}
  area.innerHTML=cache.babies.map(b=>{
    const dp=getDplus(b.bday);
    const ia=b.id===cache.settings.active_baby_id;
    const stage=ia&&dp!==null?getWeaningStage(dp):null;
    return`<div class="baby-chip${ia?' active-chip':''}" onclick="switchBaby('${b.id}')"><span>${b.avatar||'👶'}</span><span>${b.name}</span>${ia&&dp!==null?`<span class="baby-chip-days">D+${dp}</span>`:''}${stage?`<span onclick="event.stopPropagation();openWeaningModal(${dp})" style="font-size:10px;padding:1px 6px;border-radius:8px;background:${stage.color}22;color:${stage.color};font-weight:700;cursor:pointer;border:1px solid ${stage.color}44">${stage.name}</span>`:''}</div>`;
  }).join('');
}

}

function renderCubeCard(cube,dupIds){

}

    </div>
    <div class="form-group" style="margin-bottom:9px">
      <div class="expire-options"><div class="expire-opt" onclick="qEM(7,this)">+1주</div><div class="expire-opt" onclick="qEM(14,this)">+2주</div><div class="expire-opt" onclick="qEM(21,this)">+3주</div><div class="expire-opt" onclick="qEM(90,this)">+3달</div></div>
    </div>
    <!-- 공유 인라인 카테고리 추가 폼 -->
    <div class="inline-cat-form" id="m-inline-cat-form" style="margin-bottom:10px">
      <div style="font-size:12px;font-weight:600;margin-bottom:7px;color:var(--text2)">새 카테고리 추가</div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0"><label class="form-label">이름</label><input type="text" class="form-input" id="m-ic-name" placeholder="예: 간식" oninput="onMIcNameInput()"></div>
        <div class="form-group" style="margin-bottom:0"><label class="form-label">이모티콘</label><div style="display:flex;align-items:center;gap:6px"><span id="m-ic-preview" style="font-size:22px">📦</span><input type="text" class="form-input" id="m-ic-emoji" placeholder="직접입력" maxlength="2" oninput="onMIcEmojiInput()" style="flex:1"></div></div>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button type="button" onclick="saveMInlineCat()" style="padding:6px 14px;background:var(--ac);color:#fff;border:none;border-radius:7px;font-size:13px;cursor:pointer">추가</button>
        <button type="button" onclick="document.getElementById('m-inline-cat-form').classList.remove('open')" style="padding:6px 14px;background:none;border:1px solid var(--border);border-radius:7px;font-size:13px;cursor:pointer;color:var(--text)">취소</button>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:9px">
      <label class="form-label">공통 중량 단위</label>
      <div style="display:flex;gap:6px">
        <div id="m-unit-g" onclick="setMUnit('g')" style="flex:1;padding:8px;border-radius:7px;font-size:13px;border:1px solid var(--ac);background:var(--ac-light);color:var(--ac);cursor:pointer;text-align:center;font-weight:600">g</div>
        <div id="m-unit-ml" onclick="setMUnit('ml')" style="flex:1;padding:8px;border-radius:7px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;text-align:center">ml</div>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:9px">
      <label class="form-label">공통 입자 크기</label>
      <div style="display:flex;gap:5px">
        <div class="particle-opt sel-p" id="m-p-0" onclick="setMParticle(0)" style="flex:1;font-size:11px"><div>1단계</div><div style="font-size:9px;margin-top:2px">고운</div></div>
        <div class="particle-opt" id="m-p-1" onclick="setMParticle(1)" style="flex:1;font-size:11px"><div>2단계</div><div style="font-size:9px;margin-top:2px">2-3mm</div></div>
        <div class="particle-opt" id="m-p-2" onclick="setMParticle(2)" style="flex:1;font-size:11px"><div>3단계</div><div style="font-size:9px;margin-top:2px">4-5mm</div></div>
        <div class="particle-opt" id="m-p-3" onclick="setMParticle(3)" style="flex:1;font-size:11px"><div>스틱</div><div style="font-size:9px;margin-top:2px">핑거푸드</div></div>
      </div>
    </div>
    <div class="section-title" style="margin-top:2px">큐브 목록 <span style="font-weight:400;font-size:10px;text-transform:none">(이름 입력 시 카테고리 자동 설정)</span></div>
    <div style="display:grid;grid-template-columns:1.2fr 1fr 44px 44px 60px;gap:4px;margin-bottom:5px;padding:0 2px">
      <div style="font-size:10px;color:var(--text2)">이름</div>
      <div style="font-size:10px;color:var(--text2)">카테고리</div>
      <div style="font-size:10px;color:var(--text2);text-align:center">개수</div>
      <div style="font-size:10px;color:var(--text2);text-align:center">중량</div>
      <div style="font-size:10px;color:var(--text2);text-align:center">입자</div>
    </div>
    <div id="multi-rows">
      <div class="multi-add-row" data-idx="0" style="display:grid;grid-template-columns:1.2fr 1fr 44px 44px 60px;gap:4px;margin-bottom:6px">
        <input type="text" class="form-input" placeholder="예: 당근" id="mr-name-0" style="padding:7px 6px" oninput="onMrNameInput(0)">
        <select class="form-select" id="mr-cat-0" style="padding:7px 4px;font-size:11px" onchange="onMrCatChange(0,this)">${buildMultiCatOptions(defCat)}</select>
        <input type="number" class="form-input" placeholder="개" min="0" step="0.5" value="1" id="mr-qty-0" style="padding:7px 4px;text-align:center">
        <input type="number" class="form-input" placeholder="g" min="0" id="mr-weight-0" style="padding:7px 4px;text-align:center">
        <select class="form-select" id="mr-particle-0" style="padding:7px 3px;font-size:10px"><option value="-1">공통</option><option value="0">1단계</option><option value="1">2단계</option><option value="2">3단계</option><option value="3">스틱</option></select>
      </div>
    </div>
    <button class="add-row-btn" id="add-row-btn" onclick="addMultiRow()"><i class="ti ti-plus"></i> 항목 추가</button>
    <button class="btn-primary" onclick="saveMultiCubes()">모두 저장</button>
    <button class="btn-secondary" onclick="closeModal('add-modal')">취소</button>`;
}
// 일괄추가 행 이름 입력 시 카테고리 자동 설정
function onMrNameInput(idx){
  const name=document.getElementById(`mr-name-${idx}`)?.value||'';
  const{cat}=lookupFood(name);
  if(cat){const sel=document.getElementById(`mr-cat-${idx}`);if(sel&&sel.value!=='__new__')sel.value=cat;}
}
// 일괄추가 카테고리 변경 — 새 카테고리 선택 시 공유 폼 열기
function onMrCatChange(idx,sel){
  if(sel.value==='__new__'){
    sel.value=sel.dataset.prev||cache.categories[0]?.id||'';
    // 어느 행에서 요청했는지 기억
    document.getElementById('m-inline-cat-form').dataset.fromIdx=idx;
    document.getElementById('m-ic-name').value='';
    const ie=document.getElementById('m-ic-emoji');if(ie){ie.value='📦';ie.dataset.userEdited='';}
    document.getElementById('m-ic-preview').textContent='📦';
    document.getElementById('m-inline-cat-form').classList.add('open');
  }else{sel.dataset.prev=sel.value;}
}
function onMIcNameInput(){
  const name=document.getElementById('m-ic-name')?.value||'';
  const emoji=getCatEmoji(name);
  const ie=document.getElementById('m-ic-emoji');
  if(ie&&!ie.dataset.userEdited)ie.value=emoji;
  document.getElementById('m-ic-preview').textContent=emoji;
}
function onMIcEmojiInput(){
  const el=document.getElementById('m-ic-emoji');
  if(el){el.dataset.userEdited=el.value?'1':'';document.getElementById('m-ic-preview').textContent=el.value||getCatEmoji(document.getElementById('m-ic-name')?.value||'');}
}
async function saveMInlineCat(){
  const name=document.getElementById('m-ic-name')?.value?.trim();if(!name)return alert('이름을 입력해주세요');
  const emojiInput=document.getElementById('m-ic-emoji')?.value?.trim();
  const emoji=emojiInput||getCatEmoji(name);
  const color=CAT_COLORS[Math.floor(Math.random()*CAT_COLORS.length)];
  const id=uid8();const cat={id,name,emoji,color,is_default:0};
  await api('POST','/api/categories',cat);cache.categories.push(cat);renderCatManage();
  // 모든 행의 select에 새 옵션 추가
  document.querySelectorAll('.multi-add-row').forEach(row=>{
    const idx=row.dataset.idx;const sel=document.getElementById(`mr-cat-${idx}`);
    if(sel){const opt=document.createElement('option');opt.value=id;opt.textContent=`${emoji} ${name}`;sel.insertBefore(opt,sel.lastElementChild);}
  });
  // 요청한 행에 새 카테고리 자동 선택
  const fromIdx=document.getElementById('m-inline-cat-form').dataset.fromIdx;
  if(fromIdx!==undefined){const sel=document.getElementById(`mr-cat-${fromIdx}`);if(sel){sel.value=id;sel.dataset.prev=id;}}
  document.getElementById('m-inline-cat-form').classList.remove('open');
  showToast(`✅ "${name}" 카테고리 추가됨`);
}
function getMultiDate(prefix){
  const y=document.getElementById(`${prefix}-y`)?.value;
  const m=document.getElementById(`${prefix}-m`)?.value;
  const d=document.getElementById(`${prefix}-d`)?.value;
  return(y&&m&&d)?`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`:null;
}
function setMultiDate(prefix,dateStr){
  if(!dateStr)return;
  const[y,m,d]=dateStr.split('-');
  const ye=document.getElementById(`${prefix}-y`);const me=document.getElementById(`${prefix}-m`);const de=document.getElementById(`${prefix}-d`);
  if(ye)ye.value=y;if(me)me.value=parseInt(m);if(de)de.value=parseInt(d);
}
function qEM(days,el){
  document.querySelectorAll('#add-modal .expire-opt').forEach(e=>e.classList.remove('selected'));el.classList.add('selected');
  const madeDate=getMultiDate('m-made');
  const base=madeDate?new Date(madeDate):new Date();
  base.setDate(base.getDate()+days);
  setMultiDate('m-exp',base.toISOString().split('T')[0]);
}
function setMUnit(u){
  const g=document.getElementById('m-unit-g');const ml=document.getElementById('m-unit-ml');
  if(!g||!ml)return;
  if(u==='g'){g.style.cssText='flex:1;padding:8px;border-radius:7px;font-size:13px;border:1px solid var(--ac);background:var(--ac-light);color:var(--ac);cursor:pointer;text-align:center;font-weight:600';ml.style.cssText='flex:1;padding:8px;border-radius:7px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;text-align:center';}
  else{ml.style.cssText='flex:1;padding:8px;border-radius:7px;font-size:13px;border:1px solid var(--ac);background:var(--ac-light);color:var(--ac);cursor:pointer;text-align:center;font-weight:600';g.style.cssText='flex:1;padding:8px;border-radius:7px;font-size:13px;border:1px solid var(--border);background:var(--bg);color:var(--text2);cursor:pointer;text-align:center';}
}
function setMParticle(val){
  [0,1,2,3].forEach(i=>{const el=document.getElementById(`m-p-${i}`);if(el)el.classList.toggle('sel-p',i===val);});
}
function getMParticle(){
  for(let i=0;i<=3;i++){const el=document.getElementById(`m-p-${i}`);if(el&&el.classList.contains('sel-p'))return i;}
  return 0;
}
function addMultiRow(){
  const idx=multiRowCount++;const defCat=cache.categories[0]?.id||'';
  const div=document.createElement('div');div.className='multi-add-row';div.dataset.idx=idx;
  div.style.cssText='display:grid;grid-template-columns:1.2fr 1fr 44px 44px 60px;gap:4px;margin-bottom:6px';
  div.innerHTML=`<input type="text" class="form-input" placeholder="예: 브로콜리" id="mr-name-${idx}" style="padding:7px 6px" oninput="onMrNameInput(${idx})">
    <select class="form-select" id="mr-cat-${idx}" style="padding:7px 4px;font-size:11px" onchange="onMrCatChange(${idx},this)">${buildMultiCatOptions(defCat)}</select>
    <input type="number" class="form-input" placeholder="개" min="0" step="0.5" value="1" id="mr-qty-${idx}" style="padding:7px 4px;text-align:center">
    <input type="number" class="form-input" placeholder="g" min="0" id="mr-weight-${idx}" style="padding:7px 4px;text-align:center">
    <select class="form-select" id="mr-particle-${idx}" style="padding:7px 3px;font-size:10px"><option value="-1">공통</option><option value="0">1단계</option><option value="1">2단계</option><option value="2">3단계</option><option value="3">스틱</option></select>`;
  document.getElementById('add-row-btn').before(div);
}
async function saveMultiCubes(){
  const madeDate=getMultiDate('m-made');
  const expireDate=getMultiDate('m-exp');
  const unit=document.getElementById('m-unit-ml')?.style.fontWeight==='600'?'ml':'g';
  const b=activeBaby();let added=0;const saves=[];
  document.querySelectorAll('.multi-add-row').forEach(row=>{
    const idx=row.dataset.idx;
    const name=document.getElementById(`mr-name-${idx}`)?.value?.trim();if(!name)return;
    const qty=parseFloat(document.getElementById(`mr-qty-${idx}`)?.value||1);
    const weight=document.getElementById(`mr-weight-${idx}`)?.value||'';
    const rowParticleVal=parseInt(document.getElementById(`mr-particle-${idx}`)?.value??'-1');
    const rowParticle=rowParticleVal>=0?rowParticleVal:getMParticle();
    const{emoji,cat}=lookupFood(name);
    const rowCat=document.getElementById(`mr-cat-${idx}`)?.value;
    const finalCat=(rowCat&&rowCat!=='__new__')?rowCat:(cat||cache.categories[0]?.id||'');
    const cube={id:uid8(),name,emoji,cat_id:finalCat,qty,weight,unit,made_date:madeDate||null,expire_date:expireDate||null,allergy:'unknown',particle:rowParticle,note:'',baby_id:b?b.id:null};
    cache.cubes.push(cube);saves.push(api('POST','/api/cubes',cube));
    const hid='h'+uid8();saves.push(api('POST','/api/history',{id:hid,baby_id:cube.baby_id,cube_name:name,emoji,type:'added',amount:qty,memo:''}));
    cache.history.unshift({id:hid,baby_id:cube.baby_id,cube_name:name,emoji,type:'added',amount:qty,memo:'',created_at:Math.floor(Date.now()/1000)});added++;
  });
  if(!added)return alert('최소 하나의 이름을 입력해주세요');
  await Promise.all(saves);closeModal('add-modal');render();showToast(`✅ ${added}개 추가됐어요`);
}

// ── 카테고리 ──
function renderCatManage(){document.getElementById('cat-manage-list').innerHTML=cache.categories.map(cat=>{const cnt=cache.cubes.filter(c=>c.cat_id===cat.id).length;return`<div style="display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:5px"><div style="width:30px;height:30px;border-radius:50%;background:${cat.color}22;display:flex;align-items:center;justify-content:center;font-size:15px">${cat.emoji}</div><div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--text)">${cat.name}</div><div style="font-size:11px;color:var(--text2)">${cnt}개 큐브</div></div>${!cat.is_default?`<button onclick="deleteCategoryById('${cat.id}')" style="background:none;border:none;cursor:pointer;font-size:15px;color:var(--text2)"><i class="ti ti-trash"></i></button>`:''}</div>`;}).join('');}
function openCategoryModal(){selectedColor=CAT_COLORS[0];document.getElementById('new-cat-name').value='';document.getElementById('new-cat-emoji').value='';document.getElementById('color-picker').innerHTML=CAT_COLORS.map((c,i)=>`<div class="color-dot${i===0?' sel':''}" style="background:${c}" onclick="selectCatColor('${c}',this)"></div>`).join('');document.getElementById('category-modal').classList.add('open');}
function selectCatColor(c,el){selectedColor=c;document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel'));el.classList.add('sel');}
async function saveCategory(){const name=document.getElementById('new-cat-name')?.value?.trim();if(!name)return alert('이름을 입력해주세요');const emoji=document.getElementById('new-cat-emoji')?.value||getCatEmoji(name);const id=uid8();const cat={id,name,emoji,color:selectedColor,is_default:0};await api('POST','/api/categories',cat);cache.categories.push(cat);closeModal('category-modal');render();}
async function deleteCategoryById(id){if(!confirm('카테고리를 삭제하시겠어요?'))return;await api('DELETE',`/api/categories/${id}`);cache.categories=cache.categories.filter(c=>c.id!==id);render();}

// ── 설정 ──
function openSettings(){
  const tg=document.getElementById('theme-grid');
  if(tg)tg.innerHTML=THEMES.map((t,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div class="theme-swatch${i===(cache.settings.theme_idx||0)?' active':''}" style="background:${t.ac}" onclick="setTheme(${i})"></div><div style="font-size:10px;color:var(--text2)">${t.name}</div></div>`).join('');
  // 이메일 표시
  try{const p=JSON.parse(atob(getToken().split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));const el=document.getElementById('user-email-display');if(el)el.textContent=p.email||'로그인됨';}catch(e){}
  document.getElementById('settings-modal').classList.add('open');
}
async function setTheme(idx){cache.settings.theme_idx=idx;applyTheme(idx);await api('POST','/api/settings',cache.settings);const tg=document.getElementById('theme-grid');if(tg)tg.innerHTML=THEMES.map((t,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:4px"><div class="theme-swatch${i===idx?' active':''}" style="background:${t.ac}" onclick="setTheme(${i})"></div><div style="font-size:10px;color:var(--text2)">${t.name}</div></div>`).join('');}
async function clearAll(){await Promise.all([...cache.cubes.map(c=>api('DELETE',`/api/cubes/${c.id}`)),...cache.categories.filter(c=>!c.is_default).map(c=>api('DELETE',`/api/categories/${c.id}`)),...cache.babies.map(b=>api('DELETE',`/api/babies/${b.id}`))]);location.reload();}
function openBabyModal(){
  selectedAv='👶';
  const ni=document.getElementById('baby-name-input');if(ni)ni.value='';
  const by=document.getElementById('baby-bday-y');if(by)by.value='';
  const bm=document.getElementById('baby-bday-m');if(bm)bm.value='';
  const bd=document.getElementById('baby-bday-d');if(bd)bd.value='';
  renderBabyList();
  document.getElementById('baby-modal').classList.add('open');
  setTimeout(()=>{
    document.querySelectorAll('#baby-modal .av-opt').forEach(e=>{e.style.borderColor='transparent';e.style.background='none';});
    const first=document.querySelector('#baby-modal .av-opt');
    if(first){first.style.borderColor='var(--ac)';first.style.background='var(--ac-light)';}
  },0);
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function switchTab(name,tabId){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.querySelectorAll('.tab,.tab-add-slot').forEach(t=>t.classList.remove('active'));document.getElementById('page-'+name).classList.add('active');const tel=document.getElementById(tabId);if(tel)tel.classList.add('active');}
document.querySelectorAll('.modal-overlay:not(#baby-modal)').forEach(m=>{m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');});});


// ── 날짜 피커 헬퍼 ──
function openDatePicker(prefix){
  let p=document.getElementById('__dp__');
  if(!p){p=document.createElement('input');p.type='date';p.id='__dp__';p.style.cssText='position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;top:0;left:0';document.body.appendChild(p);}
  const y=document.getElementById(prefix+'-y')?.value,m=document.getElementById(prefix+'-m')?.value,d=document.getElementById(prefix+'-d')?.value;
  if(y&&m&&d)p.value=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  else p.value=new Date().toISOString().split('T')[0];
  p.onchange=function(){
    if(!p.value)return;
    const parts=p.value.split('-');
    const ye=document.getElementById(prefix+'-y'),me=document.getElementById(prefix+'-m'),de=document.getElementById(prefix+'-d');
    if(ye)ye.value=parseInt(parts[0]);if(me)me.value=parseInt(parts[1]);if(de)de.value=parseInt(parts[2]);
    p.onchange=null;
  };
  p.click();p.focus();
}
loadAll();
</script>
</body>
